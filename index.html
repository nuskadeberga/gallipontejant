uploadDataImage(icon,'webs-relacionades');let item={site_key:row.dataset.relatedKey||name.toLocaleLowerCase('ca').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')+'-'+Date.now().toString(36)+index,name,subtitle:row.querySelector('[data-related-subtitle]').value.trim(),url,icon_url:icon,sort_order:Number(row.querySelector('[data-related-order]').value)||0,visible:row.querySelector('[data-related-visible]').checked,updated_at:new Date().toISOString()};let id=row.dataset.relatedId,q=id?await SB.from('related_websites').update(item).eq('id',id):await SB.from('related_websites').insert(item).select().single();if(q.error)throw q.error;kept.push(String(id||q.data.id))}let removed=originalIds.filter(id=>!kept.includes(id));if(removed.length){let q=await SB.from('related_websites').delete().in('id',removed);if(q.error)throw q.error}await loadRelatedSites();closeModal();toast('Webs actualitzades')}catch(e){console.error(e);msg.textContent=e.message||String(e);button.disabled=false}}}
document.getElementById('manageRelatedSites').onclick=openRelatedSitesAdmin;

function download(name,text,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}document.getElementById('backup').onclick=()=>download('gallipontejant-copia-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(DB,null,2),'application/json');
const toTop=document.getElementById('toTop');toTop.onclick=()=>scrollTo({top:0,behavior:'smooth'});addEventListener('scroll',()=>toTop.classList.toggle('hidden',scrollY<420),{passive:true});
function tripFromRemote(t){return {ID_Viatge:t.id,Viatge:t.name,Descripció:t.description||'',Dies:t.days||'',Estat:t.status||'Fet','Data creació':t.creation_date||'','Data viatge':t.travel_date||'',Entorn:(t.environments||[]).join(', '),Experiència:(t.experiences||[]).join(', '),'Punt mapa':t.map_point||t.name,Localització:t.latitude!=null&&t.longitude!=null?`${t.latitude},${t.longitude}`:'','URL Foto':t.cover_url||'',Imprescindible:t.must_see||'',Interessant:t.interesting||'',Obviable:t.skippable||'','Plats típics':t.typical_dishes||'',Propina:t.tipping||'','Fus Horari':t.timezone||'','Tipus Endoll':(t.plug_types||[]).join(', '),'Extra Titol 1':t.extra_title_1||'','Extra 1':t.extra_body_1||'','Extra Titol 2':t.extra_title_2||'','Extra 2':t.extra_body_2||'','Extra Titol 3':t.extra_title_3||'','Extra 3':t.extra_body_3||''}}
function dayFromRemote(d){return {ID_Dia:d.id,'ID_Viatge(D)':d.trip_id,Dia:String(d.day_number??'').padStart(2,'0'),'Títol Dia':d.title||'',TitolFoto:d.photo_title||'',LlocFoto:d.photo_location||'',PosicioDia:d.photo_position_day||'center center',PosicioCarrusel:d.photo_position_carousel||'center center',FotoDia:d.photo_url||'',Matí:d.morning||'',Tarda:d.afternoon||'',Vespre:d.evening||'',Dormir:d.sleeping||'',Menjar:d.eating||'',Opcional:d.optional||'',Comentari:d.comment||'','Itinerari Dia':d.itinerary||'',ClauDia:d.day_key||'','KM en cotxe':d.car_km||'','Hores conducció':d.driving_hours||''}}
function localTrip(t,i){let p=coordinates(t)||[null,null];return {id:t.ID_Viatge,name:t.Viatge||'Sense nom',description:t.Descripció||null,days:Number(t.Dies)||tripDays(t.ID_Viatge).length,status:tripStatus(t),creation_date:dateOnly(t['Data creació'])||null,travel_date:dateOnly(t['Data viatge'])||null,environments:landscapes(t),experiences:experiences(t),map_point:t['Punt mapa']||t.Viatge,latitude:p[0],longitude:p[1],cover_url:t['URL Foto']||null,must_see:t.Imprescindible||null,interesting:t.Interessant||null,skippable:t.Obviable||null,typical_dishes:t['Plats típics']||null,tipping:t.Propina||null,timezone:t['Fus Horari']||null,plug_types:split(t['Tipus Endoll']),extra_title_1:t['Extra Titol 1']||null,extra_body_1:t['Extra 1']||null,extra_title_2:t['Extra Titol 2']||null,extra_body_2:t['Extra 2']||null,extra_title_3:t['Extra Titol 3']||null,extra_body_3:t['Extra 3']||null,sort_order:i,published:true}}
function localDay(d,i){return {id:d.ID_Dia||d['🔒 Row ID'],trip_id:d['ID_Viatge(D)'],day_number:Number(d.Dia)||i+1,title:d['Títol Dia']||null,photo_title:d.TitolFoto||null,photo_location:d.LlocFoto||null,photo_position_day:d.PosicioDia||'center center',photo_position_carousel:d.PosicioCarrusel||'center center',photo_url:d.FotoDia||null,morning:d.Matí||null,afternoon:d.Tarda||null,evening:d.Vespre||null,sleeping:d.Dormir||null,eating:d.Menjar||null,optional:d.Opcional||null,comment:d.Comentari||null,itinerary:d['Itinerari Dia']||null,day_key:d.ClauDia||null,car_km:d['KM en cotxe']||null,driving_hours:d['Hores conducció']||null,sort_order:i}}
async function loadRemoteDB(){if(!SB)throw Error('Supabase no disponible');let names=['trips','trip_days','trip_links','trip_infographics','trip_images'],results=await Promise.all(names.map(n=>SB.from(n).select('*').order('sort_order')));let bad=results.find(x=>x.error);if(bad)throw bad.error;let [trips,days,links,infos,images]=results.map(x=>x.data);return normalizeDB(migrateDates({trips:trips.map(tripFromRemote),days:days.map(dayFromRemote),links:links.map(x=>({'ID_Viatge(URL)':x.trip_id,Títol:x.title,Enllaços:x.url,Comentaris:x.comments||''})),infographics:infos.map(x=>({'ID_Viatge(Imatge)':x.trip_id,Títol:x.title,Infografia:x.image_url})),galleryPhotos:images.map(x=>({ID_Dia:x.id,'ID_Viatge(D)':x.trip_id,TitolFoto:x.caption||'Imatge',LlocFoto:x.location||x.caption||'',PosicioCarrusel:x.carousel_position||'center center',FotoDia:x.image_url,Dia:''})),plugImages:SEED.plugImages,durations:SEED.durations,dayIcons:SEED.dayIcons}))}
async function uploadDataImage(value,tripId){if(!String(value||'').startsWith('data:image/'))return value;let blob=await fetch(value).then(r=>r.blob()),ext=(blob.type.split('/')[1]||'jpg').replace('jpeg','jpg'),path=`${tripId}/${crypto.randomUUID()}.${ext}`,up=await SB.storage.from('gallipontejant').upload(path,blob,{contentType:blob.type,upsert:false});if(up.error)throw up.error;return SB.storage.from('gallipontejant').getPublicUrl(path).data.publicUrl}
async function syncRemoteDB(db){let session=(await SB.auth.getSession()).data.session;if(!session)throw Error('Sessió caducada');for(let t of db.trips)t['URL Foto']=await uploadDataImage(t['URL Foto'],t.ID_Viatge);for(let d of db.days)d.FotoDia=await uploadDataImage(d.FotoDia,d['ID_Viatge(D)']);for(let g of db.galleryPhotos||[])g.FotoDia=await uploadDataImage(g.FotoDia,g['ID_Viatge(D)']);localStorage.setItem(STORAGE,JSON.stringify(db));let trips=db.trips.map(localTrip),days=db.days.map(localDay),up=await SB.from('trips').upsert(trips);if(up.error)throw up.error;if(trips.length){let ids=trips.map(x=>`"${x.id.replaceAll('"','')}"`).join(',');let q=await SB.from('trips').delete().not('id','in',`(${ids})`);if(q.error)throw q.error}up=await SB.from('trip_days').upsert(days);if(up.error)throw up.error;if(days.length){let ids=days.map(x=>`"${x.id.replaceAll('"','')}"`).join(',');let q=await SB.from('trip_days').delete().not('id','in',`(${ids})`);if(q.error)throw q.error}for(let table of ['trip_links','trip_infographics','trip_images']){let q=await SB.from(table).delete().gte('sort_order',-2147483648);if(q.error)throw q.error}let links=db.links.map((x,i)=>({trip_id:x['ID_Viatge(URL)'],title:x.Títol||'Enllaç',url:x.Enllaços,comments:x.Comentaris||null,sort_order:i})),infos=db.infographics.map((x,i)=>({trip_id:x['ID_Viatge(Imatge)'],title:x.Títol||'Infografia',image_url:x.Infografia,sort_order:i})),images=(db.galleryPhotos||[]).map((x,i)=>({trip_id:x['ID_Viatge(D)'],image_url:x.FotoDia,image_type:'carousel',caption:x.TitolFoto||null,location:x.LlocFoto||null,carousel_position:x.PosicioCarrusel||'center center',sort_order:i}));for(let [table,rows] of [['trip_links',links],['trip_infographics',infos],['trip_images',images]])if(rows.length){let q=await SB.from(table).insert(rows);if(q.error)throw q.error}Object.assign(DB,db)}
function setAdmin(on){state.admin=on;document.getElementById('adminBanner').classList.toggle('hidden',!on);document.getElementById('adminDock').classList.toggle('hidden',!on);render()}
async function isAdmin(){let {data,error}=await SB.rpc('is_gallipontejant_admin');return !error&&data===true}
function loginModal(){modal('Accés d’administració',`<form id="loginForm"><p>La sessió quedarà guardada en aquest dispositiu; no hauràs d’identificar-te cada vegada.</p><div class="form-grid">${formField('email','Correu',ADMIN_EMAIL)}<div class="field"><label>Contrasenya</label><input type="password" name="password" autocomplete="current-password" required></div></div><div id="loginMessage"></div><div class="modal-actions"><button type="button" class="soft-btn" id="firstAccess">Crear primer accés</button><button class="soft-btn primary">Entrar</button></div></form>`);let msg=document.getElementById('loginMessage'),form=document.getElementById('loginForm');form.onsubmit=async e=>{e.preventDefault();msg.textContent='Entrant…';let fd=new FormData(form),{error}=await SB.auth.signInWithPassword({email:fd.get('email'),password:fd.get('password')});if(error)return msg.textContent=error.message;if(!await isAdmin()){await SB.auth.signOut();return msg.textContent='Aquest compte no té permís d’administració.'}closeModal();setAdmin(true);toast('Mode administrador activat')};document.getElementById('firstAccess').onclick=async()=>{let fd=new FormData(form),password=fd.get('password');if(!password)return msg.textContent='Escriu primer la contrasenya que vols utilitzar.';msg.textContent='Creant el compte…';let {data,error}=await SB.auth.signUp({email:fd.get('email'),password});if(error)return msg.textContent=error.message;msg.textContent=data.session?'Compte creat i sessió iniciada.':'Compte creat. Revisa el correu per confirmar-lo i després prem Entrar.';if(data.session&&await isAdmin()){closeModal();setAdmin(true)}}}
async function toggleAdmin(){if(state.admin){setAdmin(false);toast('Mode administrador desactivat');return}if(!SB)return toast('No s’ha pogut carregar Supabase');let session=(await SB.auth.getSession()).data.session;if(session&&await isAdmin()){setAdmin(true);toast('Mode administrador activat')}else loginModal()}
document.getElementById('logoutAdmin').onclick=async()=>{await syncQueue;await SB.auth.signOut();setAdmin(false);toast('Sessió tancada')};
async function boot(){render();loadRelatedSites();try{DB=await loadRemoteDB();remoteReady=true;localStorage.setItem(STORAGE,JSON.stringify(DB));render()}catch(e){console.error(e);toast('Mode sense connexió: es mostra la còpia local')}}
