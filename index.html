function normalizeDB(db){let csvv=s=>String(s||'').split(',').map(x=>x.trim()).filter(Boolean),dedupe=a=>[...new Set(a)].join(', '),rename={'Ciutats':'Ciutat','Pobles i viles':'Poblets','Camp i natura':'Campinya','Ruta per un país':'Ruta per país'},newEntorns=['Ciutat','Poblets','Costa i illes','Campinya','Ruta per país'];db.trips.forEach(t=>{if(t.Viatge==='CAMPÀNIA')t.Viatge='LA CAMPANIA';if(t.Publicat===undefined)t.Publicat=true;if(!t.Estat)t.Estat=['ALGARVE','LA PUGLIA'].includes(t.Viatge)?'Preparat':'Fet';let migrated=csvv(t['Format i entorn']),existing=csvv(t.Entorn);if(migrated.length||existing.some(x=>newEntorns.includes(x)))t.Entorn=dedupe((migrated.length?migrated:existing).map(x=>rename[x]||x));else{let o=[];if(existing.some(x=>['Ciutat','Metròpoli'].includes(x)))o.push('Ciutat');if(existing.includes('Campinya'))o.push('Poblets');if(existing.some(x=>['Costa','Insular'].includes(x)))o.push('Costa i illes');if(existing.some(x=>['Campinya','Muntanya','Volcànic'].includes(x)))o.push('Campinya');if(existing.includes('País'))o.push('Ruta per país');t.Entorn=dedupe(o)}delete t['Format i entorn'];if(!t.Experiència){let a=csvv(t.Activitats),m=csvv(t.Temàtica),s=csvv(t.Estil),o=[];if(m.some(x=>['Arqueològic','Contemporani','Cultural','Històric','Reial','Religiós'].includes(x))||a.includes('Museus'))o.push('Cultura i història');if(m.some(x=>['Gastronòmic','Vinícola'].includes(x)))o.push('Gastronomia i vi');if(a.some(x=>['Passejar','Parc  urbà','Vista panoràmica'].includes(x))||s.some(x=>['Autèntic','Clàssic','Escènic'].includes(x)))o.push('Passejar i descobrir');if(a.some(x=>['Excursió','Platja'].includes(x))||s.includes('Aventura'))o.push('Natura i aventura');if(a.includes('Mercats'))o.push('Mercats');if(s.includes('Roadtrip'))o.push('Roadtrip');if(s.includes('Relax'))o.push('Relax');t.Experiència=dedupe(o)}let ex=csvv(t.Experiència),market=ex.some(x=>['Oci','mercats i compres','Oci, mercats i compres','Compres','Mercats'].includes(x));ex=ex.filter(x=>!['Oci','mercats i compres','Oci, mercats i compres','Compres','Mercats'].includes(x));if(market)ex.push('Mercats');t.Experiència=dedupe(ex);if(!t['Tipus data'])t['Tipus data']='Creació';delete t.Activitats;delete t.Temàtica;delete t.Estil});delete db.activities;delete db.themes;delete db.styles;delete db.environments;db.plugImages=db.plugImages||SEED.plugImages;return db}

ar">Esborrar filtres</button></div><section class="trip-grid">${trips.length?trips.map(card).join(''):`<div class="empty">No hi ha cap ruta que coincideixi. Potser toca desviar-se una mica.</div>`}</section></div>`}

function detail(){let t=DB.trips.find(x=>x.ID_Viatge===state.tripId);if(t&&t.Publicat===false&&!state.admin)t=null;if(!t){state.view='home';return home()}let days=tripDays(t.ID_Viatge),links=tripLinks(t.ID_Viatge),infos=DB.infographics.filter(x=>x['ID_Viatge(Imatge)']===t.ID_Viatge),gallery=(DB.galleryPhotos||[]).filter(x=>x['ID_Viatge(D)']===t.ID_Viatge);let meta=[['Durada',(t.Dies||days.length)+' dies'],['Data',t.Data],['Estil',t.Estil],['Entorn',t.Entorn],['Fus horari',t['Fus Horari']],['Endoll',t['Tipus Endoll']],['Propina',tipLabel(t.Propina)],['Plats típics',t['Plats típics']]].filter(x=>x[1]);let tabs=[['days','Dia a dia'],...(t.RutaImatge||t.RutaVideo?[['route','Ruta completa']]:[]),['selection','Selecció'],['links','Enllaços'],['extras','Notes i extres'],['info','Infografies'],...(gallery.length?[['gallery','Galeria']]:[])];let panel='';if(state.tab==='days')panel=`<div class="day-list">${days.map(dayCard).join('')}${state.admin?`<button class="soft-btn" id="addDay">＋ Afegir dia</button>`:''}</div>`;if(state.tab==='route')panel=`<div class="route-media">${t.RutaImatge?`<figure class="route-figure"><img src="${esc(t.RutaImatge)}" alt="Ruta completa de ${esc(t.Viatge)}" loading="lazy"><figcaption>Ruta completa de ${esc(t.Viatge)}</figcaption></figure>`:''}${routeVideo(t.RutaVideo)}</div>`;if(state.tab==='selection')panel=`<div class="three-cols"><div class="list-box"><h3>✅ Imprescindible</h3><div class="prose">${esc(t.Imprescindible||'—')}</div></div><div class="list-box"><h3>⭐ Interessant</h3><div class="prose">${esc(t.Interessant||'—')}</div></div><div class="list-box"><h3>◌ Obviable</h3><div class="prose">${esc(t.Obviable||'—')}</div></div></div>`;if(state.tab==='links')panel=`<div class="link-list">${links.map(l=>`<a class="link-card" href="${esc(l.Enllaços)}" target="_blank" rel="noopener"><b>${esc(l.Títol)}</b><small>${esc(l.Comentaris||l.Enllaços)}</small></a>`).join('')||'No hi ha enllaços.'}</div>${state.admin?'<p><button class="soft-btn primary" id= function initMap(){let el=document.getElementById('travelMap');if(!el)return;if(typeof L==='undefined'){el.innerHTML='<div class="map-fallback"><div><b>El mapa necessita connexió a Internet.</b><br>La resta del web continua disponible.</div></div>';return}let points=visibleTrips().map(t=>({t,p:coordinates(t)})).filter(x=>x.p);if(!points.length){el.innerHTML='<div class="map-fallback">Encara no hi ha punts al mapa.</div>';return}mapInstance=L.map(el,{scrollWheelZoom:false,worldCopyJump:true});L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'}).addTo(mapInstance);let bounds=[];points.forEach(({t,p})=>{let color=durationColor(t),marker=L.circleMarker(p,{radius:9,color:'#fffdf5',weight:3,fillColor:color,fillOpacity:1}).addTo(mapInstance);marker.bindTooltip(esc(t['Punt mapa']||t.Viatge),{direction:'top'});marker.bindPopup(`<div class="map-popup"><h3>${esc(t['Punt mapa']||t.Viatge)}</h3><p>${esc(t.Viatge)} · ${esc(t.Dies||tripDays(t.ID_Viatge).length)} dies</p><button onclick="openTrip('${esc(t.ID_Viatge)}')">Veure el viatge</button></div>`);bounds.push(p)});mapInstance.fitBounds(bounds,{padding:[34,34],maxZoom:5})}

async function isAdmin(){let {data,error}=await SB.rpc('is_gallipontejant_admin');return !error&&data===true}
function loginModal(){modal('Accés d’administració',`<form id="loginForm"><p>La sessió quedarà guardada en aquest dispositiu; no hauràs d’identificar-te cada vegada.</p><div class="form-grid">${formField('email','Correu',ADMIN_EMAIL)}<div class="field"><label>Contrasenya</label><input type="password" name="password" autocomplete="current-password" required></div></div><div id="loginMessage"></div><div class="modal-actions"><button type="button" class="soft-btn" id="firstAccess">Crear primer accés</button><button class="soft-btn primary">Entrar</button></div></form>`);let msg=document.getElementById('loginMessage'),form=document.getElementById('loginForm');form.onsubmit=async e=>{e.preventDefault();msg.textContent='Entrant…';let fd=new FormData(form),{error}=await SB.auth.signInWithPassword({email:fd.get('email'),password:fd.get('password')});if(error)return msg.textContent=error.message;if(!await isAdmin()){await SB.auth.signOut();return msg.textContent='Aquest compte no té permís d’administració.'}closeModal();await activateAdmin();toast('Mode administrador activat')};document.getElementById('firstAccess').onclick=async()=>{let fd=new FormData(form),password=fd.get('password');if(!password)return msg.textContent='Escriu primer la contrasenya que vols utilitzar.';msg.textContent='Creant el compte…';let {data,error}=await SB.auth.signUp({email:fd.get('email'),password});if(error)return msg.textContent=error.message;msg.textContent=data.session?'Compte creat i sessió iniciada.':'Compte creat. Revisa el correu per confirmar-lo i després prem Entrar.';if(data.session&&await isAdmin()){closeModal();await activateAdmin()}}}
async function toggleAdmin(){if(state.admin){setAdmin(false);toast('Mode administrador desactivat');return}if(!SB)return toast('No s’ha pogut carregar Supabase');let session=(await SB.auth.getSession()).data.session;if(session&&await isAdmin()){await activateAdmin();toast('Mode administrador activat')}else loginModal()}
document.getElementById('logoutAdmin').onclick=async()=>{await syncQueue;await SB.auth.signOut();setAdmin(false);toast('Sessió tancada')};
async function boot(){render();loadRelatedSites();loadTravelTools();try{DB=await loadRemoteDB();remoteReady=true;localStorage.setItem(STORAGE,JSON.stringify(DB));render()}catch(e){console.error(e);toast('Mode sense connexió: es mostra la còpia local')}}
boot();
</script></body></html>
